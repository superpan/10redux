services:
  qdrant:
    # NOTE: 1.18+ can't load segment metadata written by 1.12 (unknown variant
    # 'on_disk'). Stay on 1.12 until we do a clean re-index, or migrate per
    # https://qdrant.tech/documentation/guides/migration/. Client warning about
    # version skew is benign.
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Optional: high-throughput captioning backend.
  # Enable with `docker compose --profile vllm up -d`.
  #
  # Pinned to NVIDIA's NGC vLLM build because:
  #   - It is NVIDIA-blessed for Blackwell (GB10 / sm_121); no surprises.
  #   - The 25.12.post1 tag is reproducible (no `latest` drift).
  #   - The NGC entrypoint sets up CUDA env then execs whatever we pass,
  #     so the command below must start with `vllm serve ...`.
  vllm:
    profiles: ["vllm"]
    image: nvcr.io/nvidia/vllm:25.12.post1-py3
    ports:
      - "8000:8000"
    ipc: host
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    command:
      - vllm
      - serve
      - Qwen/Qwen3-VL-8B-Instruct
      - --served-model-name=Qwen/Qwen3-VL-8B-Instruct
      - --dtype=bfloat16
      # JSON form: vLLM 0.7+ rejects the old key=value form
      - '--limit-mm-per-prompt={"image": 16}'
      - --max-model-len=16384
      # GB10 has 128 GB unified memory; the ingest process needs V-JEPA 2 and
      # Qwen3-Embedding on the same GPU (~5 GB headroom). 0.55 leaves ~70 GB
      # for vLLM (more than enough for Qwen3-VL-8B + 16K KV) and ~58 GB free.
      - --gpu-memory-utilization=0.55
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
